<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111318">
<meta name="description" content="Patch librarian with prelisten for the reface keyboards">
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--pwa-->
<link rel="apple-touch-icon" href="icon-192.png"><!--pwa-->
<title>refacelink</title>
<style>
:root{--bg:#111318;--s1:#181b21;--s2:#1f232b;--s3:#282d37;--ln:#2c313c;--ln2:#3a404d;--fg:#eef0f5;--mu:#959cad;--mu2:#6d7486;
--ac:#8090ff;--acs:rgba(128,144,255,.16);--acf:#0d1020;--ok:#3fd096;--wa:#ffb547;--bad:#ff6b6b;
--m5:#9d8cff;--m3:#ff8f45;--m4:#ff6684;--m6:#35c995;--sh:0 10px 30px rgba(0,0,0,.45);
--wk1:#fbfbf9;--wk2:#e4e4df;--bk1:#2b2d34;--bk2:#141519;--kbbg:#0a0b0e;
--f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
--hd:56px;--nav:64px;--r:14px;--safe-b:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#f3f4f7;--s1:#ffffff;--s2:#f1f3f7;--s3:#e5e8ee;--ln:#dfe3ea;--ln2:#cdd2dc;--fg:#14171d;--mu:#5c6374;--mu2:#8a90a0;
--ac:#4b5ce6;--acs:rgba(75,92,230,.12);--acf:#fff;--ok:#11905c;--wa:#b26a00;--bad:#d33b3b;--m5:#6b55f0;--m3:#e2650f;--m4:#e0345a;--m6:#119c6c;--sh:0 10px 30px rgba(20,30,60,.18);
--kbbg:#20232a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f)}
body{min-height:100vh;overflow-x:hidden;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i.f{fill:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--s3);color:var(--fg);font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--ln2)}
.btn.pri{background:var(--ac);color:var(--acf)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ac)}
.btn.ghost:hover{background:var(--acs)}
.btn.danger{background:rgba(255,107,107,.14);color:var(--bad)}
.btn.big{min-height:52px;font-size:16px;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.ib:hover{background:var(--s3)}
.ib.on{color:var(--wa)}
input[type=text],input[type=search],select,textarea{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:0 12px;min-height:44px;width:100%;outline:none}
textarea{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ac);min-height:32px}
/* ---------- layout */
#top{position:sticky;top:0;z-index:20;height:var(--hd);display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top.sc{box-shadow:0 1px 0 var(--ln)}
#top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top.page{padding-left:4px}
#back{margin-right:2px}
#pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:17px;background:var(--s2);border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--mu);margin:0 4px}
#pill i{width:8px;height:8px;border-radius:50%;background:var(--mu2)}
#pill.on{color:var(--fg)}#pill.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(63,208,150,.18)}
#pill.wait i{background:var(--wa)}
main{padding:4px 16px calc(var(--nav) + 24px + var(--safe-b));max-width:760px;margin:0 auto}
body.kb main{padding-bottom:calc(220px + var(--safe-b))}
body.selbar main{padding-bottom:calc(var(--nav) + 90px)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11.5px;font-weight:600;letter-spacing:.01em}
#tabs button span.pi{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#tabs button[aria-current=page]{color:var(--fg)}
#tabs button[aria-current=page] span.pi{background:var(--acs);color:var(--ac)}
body.page #tabs,body.kb #tabs{display:none}
@media (min-width:900px){
 #tabs{top:var(--hd);bottom:auto;height:52px;padding:0;left:50%;transform:translateX(-50%);width:min(760px,100%);grid-template-columns:repeat(5,auto);justify-content:start;gap:4px;background:none;border:0;backdrop-filter:none}
 #tabs button{flex-direction:row;font-size:14px;gap:6px;padding:0 6px}
 #tabs button span.pi{width:auto;height:36px;padding:0 12px;gap:8px}
 main{padding-top:60px;padding-bottom:40px}
 body.page main{padding-top:4px}
}
/* ---------- common bits */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px;font-weight:700}
.card .sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 4px 8px}
.mu{color:var(--mu)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.stack{display:grid;gap:10px}
.badge{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;color:#fff}
.badge.m5{background:linear-gradient(140deg,var(--m5),color-mix(in srgb,var(--m5) 60%,#000))}
.badge.m3{background:linear-gradient(140deg,var(--m3),color-mix(in srgb,var(--m3) 60%,#000))}
.badge.m4{background:linear-gradient(140deg,var(--m4),color-mix(in srgb,var(--m4) 60%,#000))}
.badge.m6{background:linear-gradient(140deg,var(--m6),color-mix(in srgb,var(--m6) 60%,#000))}
.badge.sm{width:26px;height:26px;border-radius:7px;font-size:10px}
.badge.lg{width:56px;height:56px;border-radius:16px;font-size:17px}
.seg{display:flex;background:var(--s2);border:1px solid var(--ln);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--s1);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
[data-theme=light] .seg button[aria-pressed=true]{background:#fff}
.seg button .dot{width:7px;height:7px;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:20px;background:var(--s2);border:1px solid var(--ln);font-size:14px;font-weight:600;color:var(--mu);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.star[aria-pressed=true]{background:var(--wa);border-color:var(--wa);color:#231500}
.chip small{font-weight:600;opacity:.65;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 6px 0 12px;border-radius:16px;background:var(--acs);color:var(--ac);font-size:14px;font-weight:600}
.tag button{width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.tag button svg{width:15px;height:15px}
.empty{text-align:center;padding:40px 24px;color:var(--mu)}
.empty>svg.i{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;color:var(--mu2)}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;font-size:14px}
/* ---------- library */
.search{position:relative;flex:1}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);width:19px;height:19px}
.search input{padding-left:40px;background:var(--s2);border-radius:13px}
.lib-tools{display:grid;gap:12px;padding:6px 0 10px}
.count{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:13px;font-weight:600;padding:2px 4px 6px;min-height:36px}
.plist{list-style:none;margin:0;padding:0;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.pr{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 12px;min-height:66px;border-top:1px solid var(--ln);position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;background:var(--s1)}
.pr:first-child{border-top:0}
.pr:hover{background:var(--s2)}
.pr .tx{flex:1;min-width:0}
.pr .nm{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .mt{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pr .mt b{font-weight:600;color:var(--fg);opacity:.8}
.pr .ib{width:42px;height:42px}
.pr .play{color:var(--ac)}
.pr .play.on{background:var(--acs)}
.pr .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--ln2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--acf)}
.pr .ck svg{width:16px;height:16px;stroke-width:3}
.pr.sel{background:var(--acs)}
.pr.sel .ck{background:var(--ac);border-color:var(--ac)}
.pr .idx{width:22px;text-align:center;color:var(--mu);font-weight:700;font-size:14px;flex:none}
.pr .grip{width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mu2);touch-action:none;cursor:grab;flex:none;margin-left:-8px}
.pr.cur{background:var(--acs)}
.pr.cur .idx{color:var(--ac)}
.pr.drag{z-index:5;box-shadow:var(--sh);border-radius:12px;background:var(--s2);transition:none!important}
.plist.dragging .pr:not(.drag){transition:transform .15s}
#selbar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:31;display:flex;gap:8px;padding:8px;border-radius:18px;background:var(--s3);box-shadow:var(--sh);max-width:600px;margin:0 auto}
#selbar .btn{flex:1;padding:0 8px;background:var(--s2);font-size:14px}
body.selbar #tabs{display:none}
/* ---------- patch page */
.hero{display:flex;gap:14px;align-items:flex-start;padding:6px 0 14px}
.hero .nmi{font-size:24px;font-weight:750;letter-spacing:-.01em;background:transparent;border:1px solid transparent;padding:0 8px;margin:-2px 0 0 -9px;border-radius:10px;min-height:42px;width:calc(100% + 9px)}
.hero .nmi:hover{border-color:var(--ln)}
.hero .nmi:focus{background:var(--s2)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.catbtn{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 13px;border-radius:17px;background:var(--s2);border:1px solid var(--ln);font-size:14px;font-weight:600}
.catbtn svg{width:16px;height:16px;color:var(--mu)}
.catbtn.none{color:var(--mu);border-style:dashed}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--s2);color:var(--mu);font-size:13.5px;margin:-4px 0 14px}
.note svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tags input{width:130px;min-height:34px;border-radius:17px;font-size:14px;flex:none}
.pg{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.pg summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;font-weight:700;font-size:15px;cursor:pointer}
.pg summary::-webkit-details-marker{display:none}
.pg summary svg{margin-left:auto;color:var(--mu);transition:transform .2s;width:18px;height:18px}
.pg[open] summary svg{transform:rotate(180deg)}
.pg summary small{color:var(--mu);font-weight:600}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--ln);border-top:1px solid var(--ln)}
.pv div{background:var(--s1);padding:9px 14px 10px;min-width:0}
.pv span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.pv i{display:block;height:4px;border-radius:2px;background:var(--s3);margin-top:6px;overflow:hidden}
.pv i em{display:block;height:100%;background:var(--ac);border-radius:2px}
.optbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.optbl th,.optbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--ln);white-space:nowrap}
.optbl th:first-child,.optbl td:first-child{text-align:left;padding-left:14px;color:var(--mu);font-weight:500}
.optbl thead th{color:var(--mu);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.optbl td:last-child,.optbl th:last-child{padding-right:14px}
.optbl tr.car td{color:var(--fg)}
.alg{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--ln)}
.alg svg{width:120px;height:64px;flex:none}
.infol{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;color:var(--mu)}
.infol b{color:var(--fg);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- docked keyboard */
#kb{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--kbbg);padding:0 0 var(--safe-b);box-shadow:0 -8px 30px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
#kb .ctl{display:flex;align-items:center;gap:6px;padding:8px 10px;color:#e8e9ee}
#kb .ctl .ib{color:#e8e9ee;width:40px;height:40px;background:rgba(255,255,255,.07)}
#kb .ctl .ib:hover{background:rgba(255,255,255,.14)}
#kb .oct{min-width:62px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
#kb .tg{height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.07);color:#c9ccd6;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px}
#kb .tg[aria-pressed=true]{background:var(--ac);color:var(--acf)}
#kb .tg svg{width:17px;height:17px}
.keys{position:relative;height:150px;margin:0 4px 4px;touch-action:none}
.wk,.bk{position:absolute;top:0;border-radius:0 0 7px 7px}
.wk{height:100%;background:linear-gradient(180deg,var(--wk2) 0,var(--wk1) 10%,var(--wk1) 82%,#d7d7d1 100%);box-shadow:inset 0 -5px 0 #c9c9c2,inset -1px 0 0 rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;font-size:10.5px;font-weight:700;color:#8c8f98}
.wk.on{background:linear-gradient(180deg,#cfd5ff,#b9c2ff);box-shadow:inset 0 -2px 0 #9aa6f5,inset -1px 0 0 rgba(0,0,0,.18)}
.bk{height:60%;background:linear-gradient(180deg,var(--bk2),var(--bk1) 88%,#3a3d46);box-shadow:inset 0 -4px 0 #050506,0 2px 3px rgba(0,0,0,.5);z-index:2;border-radius:0 0 5px 5px}
.bk.on{background:linear-gradient(180deg,#3d4bc0,#5868e8);box-shadow:inset 0 -2px 0 #2a36a0}
/* ---------- lists */
.lcard{display:flex;align-items:center;gap:14px;padding:14px 10px 14px 14px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;cursor:pointer;min-height:76px}
.lcard:hover{background:var(--s2)}
.lcard .ic{width:46px;height:46px;border-radius:13px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.lcard .tx{flex:1;min-width:0}
.lcard .nm{font-weight:700;font-size:16.5px}
.lcard .mt{color:var(--mu);font-size:13px;display:flex;gap:6px;align-items:center;margin-top:4px}
.lcard .chev{color:var(--mu2)}
.live{background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 22%,var(--s1)),var(--s1) 70%);border:1px solid color-mix(in srgb,var(--ac) 35%,var(--ln));border-radius:18px;padding:16px;margin:4px 0 16px}
.live .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.live .now{display:flex;align-items:center;gap:12px;margin:8px 0 14px;min-height:44px}
.live .now .nm{font-size:20px;font-weight:750;line-height:1.2}
.live .now .mt{font-size:13px;color:var(--mu)}
.live .ctrls{display:grid;grid-template-columns:auto 1fr;gap:10px}
.live .next{font-size:13px;color:var(--mu);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .next b{color:var(--fg);font-weight:600}
/* ---------- fetch / connect / files */
.hcard{display:flex;gap:14px;align-items:center}
.hcard .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--acs);color:var(--ac);flex:none}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:14px 0 6px}
.slot{aspect-ratio:1;border-radius:8px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--mu);font-variant-numeric:tabular-nums}
.slot.ok{background:color-mix(in srgb,var(--m5) 75%,var(--s1));color:#fff}
.slot.now{background:var(--ac);color:var(--acf);animation:pulse 1s infinite}
.slot.err{background:rgba(255,107,107,.25);color:var(--bad)}
@keyframes pulse{50%{opacity:.6}}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .3s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px}
.tile .k svg{width:15px;height:15px}
.tile .v{font-size:22px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;color:var(--mu);font-weight:600}
.tile .d{font-size:12.5px;color:var(--mu);margin-top:2px}
.tile.w2{grid-column:1/-1}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);width:100%;text-align:left;margin-bottom:10px;min-height:72px}
.opt:hover{border-color:var(--ac)}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.opt b{display:block;font-size:16px}
.opt span{display:block;color:var(--mu);font-size:13px}
.opt:disabled{opacity:.5}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:24px 16px;border:2px dashed var(--ln2);border-radius:16px;background:var(--s2);color:var(--fg);text-align:center}
.drop:hover,.drop.over{border-color:var(--ac);background:var(--acs)}
.drop svg.i{width:34px;height:34px;color:var(--ac);stroke-width:1.7}
.drop b{font-size:16px}
.drop span{font-size:13px;color:var(--mu)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--mu)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--s3);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true]{background:var(--ac)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-top:1px solid var(--ln)}
.srow:first-of-type{border-top:0}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-weight:600;font-size:15px}
.srow .tx span{display:block;font-size:13px;color:var(--mu)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--ln);border-radius:12px}
.stepper .ib{width:40px;height:40px}
.stepper b{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.catrow{display:flex;align-items:center;gap:6px;padding:4px 0;background:var(--s1)}
.catrow input{flex:1;min-height:42px}
.catrow .n{font-size:12px;color:var(--mu);min-width:28px;text-align:right}
/* ---------- sheet, toast */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
#sheet.show{opacity:1}
#sheet .sh{background:var(--s1);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + var(--safe-b));max-height:88vh;overflow:auto;transform:translateY(30px);transition:transform .22s cubic-bezier(.2,.8,.3,1);box-shadow:var(--sh)}
#sheet.show .sh{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--ln2);margin:2px auto 12px}
#sheet h3{margin:0 0 6px;font-size:19px;font-weight:750}
#sheet .body{color:var(--mu);font-size:15px;margin-bottom:16px}
#sheet .body p{margin:0 0 10px}
#sheet .acts{display:grid;gap:8px}
#sheet .acts.two{grid-template-columns:1fr 1fr}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:550;color:var(--fg);text-align:left}
.mrow:hover{background:var(--s2)}
.mrow svg.i{color:var(--mu)}
.mrow.danger,.mrow.danger svg.i{color:var(--bad)}
.mrow svg.i.chk{margin-left:auto;color:var(--ac)}
@media (min-width:600px){#sheet{align-items:center}#sheet .sh{border-radius:22px;padding-bottom:16px}}
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 12px + var(--safe-b));z-index:55;display:flex;justify-content:center;pointer-events:none}
body.kb #toast{bottom:calc(214px + var(--safe-b))}
body.page:not(.kb) #toast{bottom:calc(16px + var(--safe-b))}
#toast .t{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;max-width:520px;width:100%;background:#2a2f3a;color:#f2f3f7;border-radius:16px;padding:12px 8px 12px 14px;box-shadow:var(--sh);transform:translateY(16px);opacity:0;transition:all .22s}
[data-theme=light] #toast .t{background:#1d2129}
#toast .t.show{transform:none;opacity:1}
#toast .t .tx{flex:1;font-size:14px;padding-top:1px}
#toast .t .tx b{display:block;font-size:15px;margin-bottom:2px}
#toast .t .tx span{color:#c3c7d2}
#toast .t .ic{width:22px;height:22px;flex:none;color:var(--ok);margin-top:1px}
#toast .t.bad .ic{color:#ff8a8a}
#toast .t .btn{min-height:36px;background:transparent;color:#a9b4ff;padding:0 10px}
#offline{background:rgba(255,181,71,.14);color:var(--wa);font-size:13px;padding:8px 14px;border-radius:12px;margin:4px 0 12px}
</style>

<script id="rl-worklet" type="text/plain">
// refacelink: prelisten AudioWorklet. Runs the eng_* exports of refacelink.wasm (doc/project/api.md §3),
// or, while that module is missing, a small JS stand-in engine per model so the app can still be auditioned.
// Messages on port: {t:'wasm', bytes} {t:'load', model, tone} {t:'on', note, vel} {t:'off', note}
// {t:'sus', on} {t:'all'}. Replies {t:'engine', wasm:bool}.
/* global AudioWorkletProcessor, registerProcessor, sampleRate */
(function () {
  'use strict';
  var SR = typeof sampleRate !== 'undefined' ? sampleRate : 48000, TAU = Math.PI * 2;
  var ENG = ['rl_buf', 'rl_audio_l', 'rl_audio_r', 'eng_init', 'eng_load', 'eng_note_on', 'eng_note_off', 'eng_sustain', 'eng_all_off', 'eng_render'];

  function stubs(mod) {
    var o = {};
    WebAssembly.Module.imports(mod).forEach(function (im) {
      o[im.module] = o[im.module] || {};
      if (im.kind === 'function') o[im.module][im.name] = function () { return 0; };
      else if (im.kind === 'memory') o[im.module][im.name] = new WebAssembly.Memory({ initial: 32 });
      else if (im.kind === 'table') o[im.module][im.name] = new WebAssembly.Table({ initial: 16, element: 'anyfunc' });
      else if (im.kind === 'global') o[im.module][im.name] = new WebAssembly.Global({ value: 'i32', mutable: true }, 0);
    });
    return o;
  }

  function mtof(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function db(steps, per) { return Math.pow(10, -steps * per / 20); }
  function tau(rate) { return 8 * Math.pow(2, -rate / 11); }            // EG rate 0..127 -> time constant, s
  function coef(t) { return 1 - Math.exp(-1 / (Math.max(t, 0.0005) * SR)); }

  // ---------------------------------------------------------------- JS stand-in engines
  var ALG = [
    [{ 0: [1], 1: [2], 2: [3] }, [0]], [{ 0: [1], 1: [2, 3] }, [0]], [{ 1: [2], 0: [1, 3] }, [0]], [{ 1: [3], 2: [3], 0: [1, 2] }, [0]],
    [{ 0: [1, 2, 3] }, [0]], [{ 2: [3], 1: [2] }, [0, 1]], [{ 2: [3], 1: [2], 0: [2] }, [0, 1]], [{ 0: [1], 2: [3] }, [0, 2]],
    [{ 0: [3], 1: [3], 2: [3] }, [0, 1, 2]], [{ 1: [3], 2: [3] }, [0, 1, 2]], [{ 2: [3] }, [0, 1, 2]], [{}, [0, 1, 2, 3]]
  ];

  function Engine() { this.model = 5; this.t = null; this.v = []; this.sus = false; this.lfo = 0; this.dl = new Float32Array(SR); this.dw = 0; }
  Engine.prototype.load = function (m, tone) { this.model = m; this.t = tone; this.prep(); };
  Engine.prototype.prep = function () {
    var t = this.t, m = this.model, p = this.p = {};
    if (!t) return;
    if (m === 5) {
      p.alg = ALG[Math.min(11, t[0x10])]; p.tp = t[0x0C] - 64; p.ops = [];
      for (var i = 0; i < 4; i++) {
        var b = 38 + i * 28, c = t[b + 0x16], f = t[b + 0x17];
        var fixed = t[b + 0x15] === 1, r = fixed ? Math.pow(10, Math.min(3, c >> 3)) * Math.pow(9.772, f / 99) : (c ? c + f * 0.01 : 0.5 + f * 0.005);
        p.ops.push({ on: t[b], fixed: fixed, r: r * Math.pow(1.00033913, t[b + 0x18] - 64), out: t[b + 0x12] ? db(127 - t[b + 0x12], 0.55) : 0,
          fb: t[b + 0x13] / 127 * 0.22, sq: t[b + 0x14] === 1, vs: t[b + 0x11] / 127,
          R: [t[b + 1], t[b + 2], t[b + 3], t[b + 4]], L: [t[b + 5], t[b + 6], t[b + 7], t[b + 8]].map(function (l) { return l ? db(127 - l, 0.5) : 0; }) });
      }
    } else if (m === 3) {
      p.type = t[6]; p.tex = t[7] / 127; p.mod = t[8] / 127; p.cut = 40 * Math.pow(2, t[9] / 127 * 9); p.res = t[10] / 127;
      p.bal = t[11] / 127; p.a = 0.002 + Math.pow(t[12] / 127, 2) * 4; p.d = 0.01 + Math.pow(t[13] / 127, 2) * 5; p.s = t[14] / 127; p.r = 0.01 + Math.pow(t[15] / 127, 2) * 6;
      p.la = t[2]; p.ld = t[3] / 127; p.ls = 0.1 + Math.pow(t[4] / 127, 2) * 20;
    } else if (m === 4) {
      p.type = t[2]; p.drive = t[3] / 127; p.trem = t[4]; p.td = t[5] / 127; p.tr = 0.5 + t[6] / 127 * 9; p.cho = t[7] ? t[8] / 127 : 0;
      p.del = t[10] ? t[11] / 127 : 0; p.dt = 0.05 + t[12] / 127 * 0.6; p.rev = t[13] / 127;
    } else {
      p.wave = t[2]; p.ft = []; for (var k = 0; k < 9; k++) p.ft.push(Math.pow(t[3 + k] / 6, 1.4) * 0.22);
      p.vib = t[12] === 0 ? t[13] / 4 : 0; p.cho = t[12] === 1 ? t[13] / 4 : 0; p.perc = t[14]; p.pt = t[15]; p.pl = 0.08 + t[16] * 0.12;
      p.rot = [0, 0, 0.8, 6.2][t[17]]; p.drive = t[18] / 127; p.rev = t[19] / 127;
    }
  };
  Engine.prototype.maxv = function () { return this.model === 4 ? 16 : this.model === 6 ? 32 : 8; };
  Engine.prototype.on = function (n, vel) {
    if (!this.t) return;
    for (var i = 0; i < this.v.length; i++) if (this.v[i].n === n) this.v.splice(i--, 1);
    if (this.v.length >= this.maxv()) this.v.shift();
    var v = { n: n, vel: vel / 127, gate: true, held: false, age: 0, f: mtof(n + (this.model === 5 ? this.p.tp : 0)) };
    if (this.model === 5) { v.ph = [0, 0, 0, 0]; v.y = [0, 0, 0, 0]; v.e = [0, 0, 0, 0]; v.st = [0, 0, 0, 0]; }
    else { v.ph = 0; v.ph2 = 0; v.ph3 = 0; v.env = 0; v.st = 0; v.lp = 0; v.bp = 0; v.pe = 1; }
    this.v.push(v);
  };
  Engine.prototype.off = function (n) { this.v.forEach(function (v) { if (v.n === n && v.gate) { v.gate = false; v.held = this.sus; } }, this); };
  Engine.prototype.sustain = function (on) { this.sus = on; if (!on) this.v.forEach(function (v) { v.held = false; }); };
  Engine.prototype.all = function () { this.v = []; };

  Engine.prototype.dx = function (v) {
    var p = this.p, o = p.ops, a = p.alg, mods = a[0], car = a[1], out = 0, rel = !v.gate && !v.held;
    for (var i = 3; i >= 0; i--) {
      var op = o[i];
      if (!op.on) { v.y[i] = 0; continue; }
      var st = rel ? 3 : v.st[i], tgt = op.L[st], e = v.e[i];
      e += (tgt - e) * coef(tau(op.R[st]) * (st === 0 ? 0.3 : 1));
      if (!rel && st < 2 && Math.abs(tgt - e) < 0.002) v.st[i] = st + 1;
      v.e[i] = e;
      var m = 0, src = mods[i];
      if (src) for (var k = 0; k < src.length; k++) m += v.y[src[k]];
      var fbv = op.sq ? (v.y[i] > 0 ? 1 : -1) * Math.abs(v.y[i]) * 0.7 : v.y[i];
      var amp = op.out * e * (1 - op.vs * (1 - v.vel));
      var y = Math.sin(TAU * (v.ph[i] + m * 1.6 + fbv * op.fb)) * amp;
      v.y[i] = y;
      v.ph[i] += (op.fixed ? op.r : op.r * v.f) / SR; if (v.ph[i] > 1) v.ph[i] -= 1;
    }
    for (var c = 0; c < car.length; c++) out += v.y[car[c]];
    v.dead = rel && Math.max.apply(null, v.e) < 0.0005;
    return out / Math.sqrt(car.length) * 0.5;
  };

  Engine.prototype.cs = function (v, lfo) {
    var p = this.p, rel = !v.gate && !v.held, f = v.f;
    if (p.la === 3) f *= 1 + lfo * p.ld * 0.06;
    // ADSR
    if (rel) v.env += (0 - v.env) * coef(p.r * 0.3);

  function seed() {
    var now = Date.now();

    var ps = st.map(function (s, i) {

  // ------------------------------------------------------------------ keyboard (docked on the patch page)
  var kbHeld = {}, kbKeys = null;

    var kb = $('#kb');

    kb.innerHTML = '<div class="ctl"><button class="ib" data-k="dn" aria-label="Octave down">' + ic('back') + '</button><span class="oct">' + noteName(base) + '–' + noteName(base + 23) + '</span><button class="ib" data-k="up" aria-label="Octave up">' + ic('right') + '</button>' +
      '<span class="sp"></span><button class="tg" data-k="sus" aria-pressed="' + S.sus + '">' + ic('pedal') + 'Sustain</button><button class="tg" data-k="ref" aria-pressed="' + !!S.set.keysToReface + '" title="Also play the notes on the reface">' + ic('send') + 'reface</button></div><div class="keys" id="keys"></div>';
    var keys = $('#keys'), wi = 0, ww = 100 / 14, html = '';
    for (var n = 0; n < 24; n++) {
      var pc = n % 12, black = [1, 3, 6, 8, 10].indexOf(pc) >= 0;
      if (!black) { html += '<div class="wk" data-n="' + (base + n) + '" style="left:calc(' + (wi * ww) + '% + 1px);width:calc(' + ww + '% - 2px)">' + (pc === 0 ? noteName(base + n) : '') + '</div>'; wi++; }
      else { var adj = { 1: -0.07, 3: 0.07, 6: -0.09, 8: 0, 10: 0.09 }[pc], bw = ww * 0.6; html += '<div class="bk" data-n="' + (base + n) + '" style="left:' + ((wi + adj) * ww - bw / 2) + '%;width:' + bw + '%"></div>'; }
    }
    keys.innerHTML = html;

  // next/previous index in the list, skipping patches for another model once the reface model is known
  function listStep(l, from, dir) {

  // drag to reorder: the grip starts at once, a long press on the row (touch) after 450 ms
  function sortable(ul, onMove) {
    if (!ul) return;
    var st = null, lp = null, y0 = 0;
    function begin(li, e) {
      var items = Array.prototype.slice.call(ul.children), idx = items.indexOf(li);
      st = { li: li, items: items, idx: idx, to: idx, y0: e.clientY, rects: items.map(function (x) { return x.getBoundingClientRect(); }), id: e.pointerId };
      li.classList.add('drag'); ul.classList.add('dragging');
      try { ul.setPointerCapture(e.pointerId); } catch (x) {}
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (x) {}
    }
    ul.addEventListener('pointerdown', function (e) {
      var li = e.target.closest('.pr'); if (!li || li.parentNode !== ul || e.target.closest('button')) return;
      if (e.target.closest('.grip')) { e.preventDefault(); begin(li, e); return; }
      if (e.pointerType !== 'mouse') { y0 = e.clientY; lp = setTimeout(function () { lp = null; begin(li, e); }, 450); }
    });
    ul.addEventListener('pointermove', function (e) {
      if (lp && Math.abs(e.clientY - y0) > 8) { clearTimeout(lp); lp = null; }
      if (!st) return;
      var dy = e.clientY - st.y0, r = st.rects[st.idx], c = r.top + r.height / 2 + dy, to = st.idx;
      st.rects.forEach(function (rr, i) { var mid = rr.top + rr.height / 2; if (i > st.idx && c > mid) to = i; if (i < st.idx && c < mid && to >= st.idx) to = i; });
      for (var i = st.idx - 1; i >= 0; i--) if (c < st.rects[i].top + st.rects[i].height / 2) to = i;
      st.to = to;
      st.li.style.transform = 'translateY(' + dy + 'px)';
      st.items.forEach(function (it, i) {
        if (it === st.li) return;
        var s = i > st.idx && i <= to ? -r.height : i < st.idx && i >= to ? r.height : 0;
        it.style.transform = s ? 'translateY(' + s + 'px)' : '';
      });
    });
    ul.addEventListener('touchmove', function (e) { if (st) e.preventDefault(); }, { passive: false });
    function end() {
      clearTimeout(lp); lp = null;
      if (!st) return;
      var s = st; st = null;
      s.items.forEach(function (it) { it.style.transform = ''; });
      s.li.classList.remove('drag'); ul.classList.remove('dragging');
      ul._noclick = Date.now();
      if (s.to !== s.idx) onMove(s.idx, s.to);
    }
    ul.addEventListener('pointerup', end); ul.addEventListener('pointercancel', end);
  }

  // ------------------------------------------------------------------ MIDI in, fetch, backup
  function onMidi(msg) {
    if (msg[0] === 0xF0 && msg[1] === 0x7E && msg[3] === 0x06 && msg[4] === 0x02 && msg[5] === 0x43) {
      var m = msg[8] - 0x4E;   // 51 CS, 52 CP, 53 DX, 54 YC -> 3..6
      if (MN[m]) { S.model = m; if (S.tr && S.tr.setModel) S.tr.setModel(m); updatePill(); refresh(); }
    }
    waiters.slice().forEach(function (w) { w(msg); });
  }

  function waitFor(test, ms, what) {
    return new Promise(function (res, rej) {
      var to = setTimeout(function () { done(); rej(new Error(what || 'No answer from the reface.')); }, ms);
      function w(msg) { var r = test(msg); if (r) { done(); res(r); } }
      function done() { clearTimeout(to); var i = waiters.indexOf(w); if (i >= 0) waiters.splice(i, 1); }
      waiters.push(w);
    });
  }
  function waitDump(model, ms) {
    var buf = [];
    return waitFor(function (msg) {
      if (msg[0] !== 0xF0 || msg[1] !== 0x43 || msg[4] !== 0x1C) return null;
      buf.push(msg);
      if (msg.length === 13 && msg[8] === 0x0F && msg[9] === 0x0F && msg[7] === model) return { r: RL.rf.parse(concat(buf)) };
      return null;
    }, ms, 'No answer from the reface. Is it switched on and connected?').then(function (x) {
      if (!x.r || x.r.model <= 0) throw new Error(x.r && x.r.model < 0 ? 'The dump arrived with a checksum error. Try again.' : 'The dump was incomplete. Try again.');
      return x.r;
    });
  }
  function identify() {
    if (!connected()) return Promise.reject(new Error('Not connected'));
    var p = waitFor(function (m) { return m[1] === 0x7E && m[4] === 0x02 && MN[m[8] - 0x4E] ? m[8] - 0x4E : 0; }, 1500, 'No reface answered. Is it switched on?');
    S.tr.send(new Uint8Array([0xF0, 0x7E, 0x7F, 0x06, 0x01, 0xF7]));
    return p;
  }
  function needModel() { return S.model ? Promise.resolve(S.model) : identify(); }

  function fetchCurrent() {
    if (!connected()) return go('#tab=connect');
    S.fetching = true; S.fetched = null; renderFetch();
    return needModel().then(function (m) {
      var p = waitDump(m, 2500);
      S.tr.send(RL.rf.buildRequest(m));
      return p;
    }).then(function (r) {
      var n = RL.rf.name(r.model, r.tone), cnt = S.patches.filter(function (p) { return p.model === r.model; }).length + 1;
      var name = n || L.autoName(r.model, r.tone, cnt);
      S.fetched = { model: r.model, tone: r.tone, name: name, category: L.guessCategory(r.model, r.tone, n, S.cats[r.model]) };
      A.load(r.model, r.tone);
    }).catch(function (e) { toast("Couldn't fetch the sound", e.message, { bad: true }); }).then(function () { S.fetching = false; if (S.view === 'fetch' && !S.page) renderFetch(); });
  }

  function saveFetched(open) {
    var f = S.fetched; if (!f) return;
    var p = newPatch(f.model, f.tone, f.name, { category: f.category, source: 'Fetched from reface ' + MN[f.model] });
    S.patches.push(p); savePatch(p);
    S.fetched = null; renderFetch();
    toast('Saved “' + p.name + '”', 'It is in your library' + (p.category ? ' under ' + p.category : '') + '.', { action: { label: 'Open', fn: function () { go('#patch=' + p.id); } } });
    if (open) go('#patch=' + p.id);
  }

  function backupAll() {
    if (!connected() || S.model !== 5) return;
    ask('Back up all 32 memories?', '<p>The app switches the DX through memories 1-1 to 4-8 and reads each voice. <b>Unsaved edits on the DX are lost</b> when it changes memory. This takes about 15 seconds.</p>', 'Start backup').then(function (ok) {
      if (ok) runBackup();
    });
  }
  function runBackup() {
    var bk = S.bk = { running: true, slot: 0, res: [], cancel: false, started: Date.now() }, ch = (S.set.channel || 1) - 1;
    renderFetch();
    var i = 0;
    function step() {
      if (bk.cancel || i >= 32) return finish();
      bk.slot = i; renderFetch();
      S.tr.send(new Uint8Array([0xC0 | ch, i]));
      return sleep(150).then(function () {
        var p = waitDump(5, 2500); S.tr.send(RL.rf.buildRequest(5)); return p;
      }).then(function (r) { bk.res[i] = { ok: true, tone: r.tone, name: RL.rf.name(5, r.tone) || 'Memory ' + slotName(i) }; },
        function () { bk.res[i] = { ok: false }; }).then(function () { i++; return step(); });
    }
    function finish() {
      bk.running = false;
      var got = bk.res.filter(function (r) { return r && r.ok; });
      if (got.length) {
        var d = new Date(), label = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }), now = Date.now(), ids = [];
        bk.res.forEach(function (r, k) {
          if (!r || !r.ok) return;
          var p = newPatch(5, r.tone, r.name, { category: L.guessCategory(5, r.tone, r.name, S.cats[5]), source: 'DX backup ' + fmtDate(now) + ', memory ' + slotName(k), created: now + k, modified: now + k });
          S.patches.push(p); ids.push(p.id);
        });
        D.putMany('patches', S.patches.filter(function (p) { return ids.indexOf(p.id) >= 0; }));
        var l = { id: uid('l'), name: 'DX backup ' + label, patches: ids, created: now };
        S.lists.push(l); saveList(l); bk.list = l.id;
        toast(bk.cancel ? 'Backup stopped' : 'Backup complete', plural(got.length, 'voice') + ' saved to the list “' + l.name + '”.', { action: { label: 'Open', fn: function () { go('#list=' + l.id); } } });
      } else toast('Backup failed', 'No voice could be read.', { bad: true });
      renderFetch();
    }
    step();
  }
  function slotName(i) { return (Math.floor(i / 8) + 1) + '-' + (i % 8 + 1); }

  // ------------------------------------------------------------------ fetch screen
  function renderFetch() {
    var v = $('#v-fetch');

    if (!connected()) {
      v.innerHTML = '<div class="empty">' + ic('fetch') + '<h3>No reface connected</h3><p>Connect the Bluetooth bridge or a USB cable to read sounds from your reface.</p><button class="btn pri" data-act="goconn">' + ic('conn') + 'Connect</button></div>';

    var m = S.model, h = '';

      (m ? 'Connected via ' + esc(S.tr.name) : 'Switch the reface on. The bridge asks it who it is.') + '</div></div>' + (m ? '' : '<button class="btn" data-act="ident">Detect</button>') + '</div>';
    h += '<div class="card"><h2>Current sound</h2><p class="sub">Reads the sound the reface is playing right now' + (m === 5 ? ' (the edit buffer)' : ', as the knobs set it,') + ' into your library.</p>';
    if (S.fetched) {
      var f = S.fetched;
      h += '<ul class="plist" style="margin-bottom:12px"><li class="pr" style="cursor:default"><span class="badge m' + f.model + '">' + MN[f.model] + '</span><div class="tx"><div class="nm">' + esc(f.name) + '</div><div class="mt">' +
        (f.category ? 'Suggested: <b>' + esc(f.category) + '</b>' : 'No category suggested') + '</div></div><button class="ib play" data-act="fprel" aria-label="Prelisten">' + ic('play', 'f') + '</button></li></ul>' +
        '<div class="row" style="gap:8px"><button class="btn" data-act="fdrop" style="flex:1">Discard</button><button class="btn pri" data-act="fsave" style="flex:2">' + ic('save') + 'Save to library</button></div>';
    } else h += '<button class="btn pri big wide" data-act="fetch"' + (S.fetching || (S.bk && S.bk.running) ? ' disabled' : '') + '>' + ic('fetch') + (S.fetching ? 'Reading…' : 'Fetch current sound') + '</button>';
    h += '</div>';
    if (m === 5) {
      var bk = S.bk;
      h += '<div class="card"><h2>Back up all 32 memories</h2><p class="sub">Steps through memories 1-1 to 4-8 and saves every voice into the library and a new favourite list.</p>';
      if (bk) {
        var done = bk.res.filter(Boolean).length;
        h += '<div class="slots">' + Array.apply(null, Array(32)).map(function (_, i) {
          var r = bk.res[i], c = r ? (r.ok ? 'ok' : 'err') : bk.running && i === bk.slot ? 'now' : '';
          return '<div class="slot ' + c + '" title="' + (r && r.ok ? esc(r.name) : slotName(i)) + '">' + slotName(i) + '</div>';
        }).join('') + '</div><div class="row sm mu" style="margin:6px 2px 8px"><span>' + (bk.running ? 'Reading memory ' + slotName(bk.slot) + (bk.res[bk.slot - 1] && bk.res[bk.slot - 1].ok ? ' · last: ' + esc(bk.res[bk.slot - 1].name) : '') : (bk.cancel ? 'Stopped' : 'Done') + ' · ' + plural(bk.res.filter(function (r) { return r && r.ok; }).length, 'voice') + ' saved') + '</span><span class="sp"></span><span>' + done + ' / 32</span></div>' +
          '<div class="bar" style="margin-bottom:14px"><i style="width:' + (done / 32 * 100) + '%"></i></div>';
        h += bk.running ? '<button class="btn danger big wide" data-act="bkcancel">' + ic('x') + 'Cancel</button>' :
          '<div class="row" style="gap:8px">' + (bk.list && listById(bk.list) ? '<button class="btn" data-act="bkopen" style="flex:1">Open list</button>' : '') + '<button class="btn pri" data-act="bkstart" style="flex:1">Back up again</button></div>';
      } else h += '<button class="btn big wide" data-act="bkstart"' + (S.fetching ? ' disabled' : '') + '>' + ic('save') + 'Back up 32 memories</button>';
      h += '</div>';
    } else if (m) {
      h += '<div class="note">' + ic('info') + '<span>The ' + MN[m] + ' has no memories: its sound is what the knobs are set to. Fetch it whenever you like it.</span></div>';
    }
    v.innerHTML = h;
  }

  // ------------------------------------------------------------------ files screen
  function exportChoices() {
    var o = [];
    L.MODELS.forEach(function (m) { var n = S.patches.filter(function (p) { return p.model === m; }).length; o.push(['model:' + m, 'All ' + MN[m] + ' patches', n]); });

  }
  function exportSet(k) {

    if (k === 'fav') return { ps: sorted(S.patches.filter(function (p) { return p.fav; })), name: 'refacelink-favourites' };

  function renderFiles() {

      '<button class="drop" data-act="import" id="drop">' + ic('import') + '<b>Choose .syx files</b><span>or drop them here</span></button></div>' +

      '<button class="btn pri big wide" data-act="export"' + (cur.ps.length ? '' : ' disabled') + '>' + ic('export') + 'Export ' + plural(cur.ps.length, 'patch').replace('patchs', 'patches') + ' as .syx</button>' +
      '<p class="mu sm" style="margin:10px 2px 0">To export a hand-picked set, use Select in the library.</p></div>' +

  function importFlow() { pickFiles('.syx,.SYX,application/octet-stream').then(importFiles); }

  function importFiles(files) {
    if (!files || !files.length) return;
    var found = [], bad = 0, have = {};
    S.patches.forEach(function (p) { have[p.model + ':' + p.tone] = p; });
    files.forEach(function (f) {
      var rs = RL.rf.parseAll(f.bytes), base = f.name.replace(/\.[^.]*$/, '');

      });
    });
    if (!found.length) { toast('Nothing to import', 'No complete reface dump was found in ' + (files.length === 1 ? files[0].name : 'these files') + '.', { bad: true }); return; }
    importSheet(found, bad);
  }

  function importSheet(found, bad) {
    var dups = found.filter(function (f) { return f.dup; }).length;
    var body = '<p>' + plural(found.length, 'patch').replace('patchs', 'patches') + ' found' + (dups ? ', ' + dups + ' already in your library (unticked)' : '') + (bad ? '. ' + plural(bad, 'file') + ' had no reface data' : '') + '. Categories are suggestions; change them here or later.</p>' +
      '<ul class="plist" id="imp" style="max-height:50vh;overflow:auto">' + found.map(function (f, i) {
        var cats = S.cats[f.model] || [];
        return '<li class="pr' + (f.on ? ' sel' : '') + '" data-ii="' + i + '" style="cursor:default"><span class="ck" data-act="itog">' + ic('check') + '</span><span class="badge sm m' + f.model + '">' + MN[f.model] + '</span>' +
          '<div class="tx"><div class="nm">' + esc(f.name) + '</div><div class="mt">' + (f.dup ? 'Already in library as “' + esc(f.dup.name) + '”' : esc(f.file)) + '</div></div>' +
          '<select data-ic="' + i + '" style="width:118px;min-height:40px;font-size:14px;padding:0 8px"><option value="">No category</option>' + cats.map(function (c) { return '<option' + (c === f.category ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></li>';
      }).join('') + '</ul>';
